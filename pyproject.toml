[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ara1-financial-research-agent"
version = "0.1.0"
description = "Autonomous Financial Research Agent with Multi-Source Synthesis (ARA-1)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zetheta Research Intern", email = "intern@quantumedge.com"}
]
dependencies = [
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "openai>=1.30.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "yfinance>=0.2.36",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "tools*", "memory*", "synthesis*", "evaluation*"]
